name: Convert and deploy
on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

env:
  IMAGE: ghcr.io/${{ github.actor }}/cv-converter

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Login to GHRC
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  convert:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: prod
    env:
      FILENAME: ${{ vars.FILENAME }}
    steps:
      - name: Check required variables
        run: |
          : "${FILENAME:?Repository variable FILENAME is not set}"

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Convert to HTML
        run: |
          docker run \
          -w /data \
          -v ".:/data" \
          -u "$(id -u):$(id -g)" \
          "$IMAGE:latest" \
          -s input.md \
          --css=cv.css \
          --embed-resources \
          --metadata pagetitle="$FILENAME" \
          -o "dist/$FILENAME.html"

      - name: Convert to PDF
        run: |
          docker run \
          -w /data \
          -v ".:/data" \
          -u "$(id -u):$(id -g)" \
          "$IMAGE:latest" \
          -s input.md \
          -t html \
          --css=cv.css \
          --embed-resources \
          --metadata pagetitle="$FILENAME" \
          --pdf-engine=weasyprint \
          -o "dist/$FILENAME.pdf"

      - name: Deploy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIV_KEY }}
          source: "dist"
          target: "/home/${{ secrets.VPS_SSH_USER }}/cv"
