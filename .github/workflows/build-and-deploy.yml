name: Convert and deploy
on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Login to GHRC
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.actor }}/cv-converter:latest
          #TODO: use cache

  convert:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Convert to HTML
        run: |
          docker run \
          -w /data \
          -v ".:/data" \
          -u "$(id -u):$(id -g)" \
          ghcr.io/${{ github.actor }}/cv-converter:latest \
          -s input.md \
          --css=cv.css \
          --embed-resources \
          -o dist/${{ vars.FILENAME }}.html

      - name: Convert to PDF
        run: |
          docker run \
          -w /data \
          -v ".:/data" \
          -u "$(id -u):$(id -g)" \
          ghcr.io/${{ github.actor }}/cv-converter:latest \
          -s input.md \
          -t html \
          --css=cv.css \
          --embed-resources \
          --pdf-engine=weasyprint \
          -o dist/${{ vars.FILENAME }}.pdf 
         
      - name: Deploy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIV_KEY }}
          source: "dist"
          target: "/home/${{ secrets.VPS_SSH_USER }}/cv"
          
